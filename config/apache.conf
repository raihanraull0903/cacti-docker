<VirtualHost *:80>

    ServerAdmin admin@localhost

    DocumentRoot /var/www/html/cacti

    <Directory /var/www/html/cacti>

        AllowOverride All

        Require all granted

        Options FollowSymLinks

    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log

    CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>
